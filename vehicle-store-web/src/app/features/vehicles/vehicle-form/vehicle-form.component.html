<div class="modal-backdrop" (click)="onCancel()">
  <div class="modal" (click)="$event.stopPropagation()">
    <h2>{{ isEditMode ? 'Edit Vehicle' : 'Register Vehicle' }}</h2>

    @if (errorMessage()) {
      <div class="alert-error">{{ errorMessage() }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-grid">
        <div class="field">
          <label for="plateNumber">Plate Number</label>
          <input id="plateNumber" type="text" formControlName="plateNumber" />
        </div>
        <div class="field">
          <label for="document">Document</label>
          <input id="document" type="text" formControlName="document" />
        </div>
        <div class="field">
          <label for="brand">Brand</label>
          <input id="brand" type="text" formControlName="brand" />
        </div>
        <div class="field">
          <label for="model">Model</label>
          <input id="model" type="text" formControlName="model" />
        </div>
        <div class="field">
          <label for="year">Year</label>
          <input id="year" type="number" formControlName="year" />
        </div>
        <div class="field">
          <label for="price">Price</label>
          <input id="price" type="number" step="0.01" formControlName="price" />
        </div>
      </div>
      <div class="form-actions">
        <button type="button" class="btn-secondary" (click)="onCancel()">Cancel</button>
        <button type="submit" class="btn-primary" [disabled]="loading()">
          {{ loading() ? 'Saving...' : (isEditMode ? 'Update' : 'Register') }}
        </button>
      </div>
    </form>
  </div>
</div>
